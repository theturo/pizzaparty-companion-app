# Seconda rete di sicurezza: gitleaks su ogni push e pull request,
# anche se il controllo locale prima del commit fosse stato saltato.
name: Anti-segreti

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Installa gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Controlla tutta la storia
        run: gitleaks git --redact --no-banner --verbose .
